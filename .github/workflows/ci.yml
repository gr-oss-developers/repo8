name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test

  run:
    name: Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build
      - name: Start service and wait for readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo run &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "service did not become ready within 30s"
            exit 1
          fi
      - name: Call repos endpoint and print payload
        run: |
          http_code=$(curl -sS -o repos.json -w '%{http_code}' 'http://127.0.0.1:8080/repos?username=pavlovic-ivan')
          echo "HTTP status: $http_code"
          cat repos.json
          [ "$http_code" = "200" ] || { echo "expected HTTP 200" >&2; exit 1; }
          jq -e 'type == "array"' repos.json > /dev/null || { echo "response is not a JSON array" >&2; exit 1; }
